<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Arena - 交易竞技场</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .summary-card h3 {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .summary-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .summary-card .positive {
            color: #10b981;
        }
        
        .summary-card .negative {
            color: #ef4444;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        
        .card h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaderboard-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 15px;
            text-align: left;
        }
        
        .leaderboard-table tbody tr {
            border-bottom: 1px solid #eee;
            transition: background 0.2s ease;
        }
        
        .leaderboard-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .rank {
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .rank-1 {
            color: #fbbf24;
        }
        
        .rank-2 {
            color: #9ca3af;
        }
        
        .rank-3 {
            color: #cd7f32;
        }
        
        .strategy-name {
            font-weight: 600;
            color: #667eea;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-online {
            background: #10b981;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s ease;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: white;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Trading Arena</h1>
            <p class="subtitle">
                <span class="status-indicator status-online"></span>
                实时 AI 策略竞技场 - 让最优秀的算法胜出
            </p>
        </header>
        
        <div class="summary-grid" id="summaryGrid">
            <div class="summary-card">
                <h3>总策略数</h3>
                <div class="value" id="totalStrategies">-</div>
            </div>
            <div class="summary-card">
                <h3>活跃策略</h3>
                <div class="value" id="activeStrategies">-</div>
            </div>
            <div class="summary-card">
                <h3>总交易次数</h3>
                <div class="value" id="totalTrades">-</div>
            </div>
            <div class="summary-card">
                <h3>总盈亏</h3>
                <div class="value" id="totalPnl">$0.00</div>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>🏆 排行榜</h2>
                    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
                </div>
                
                <div class="tabs">
                    <button class="tab active" onclick="switchMetric('total_pnl')">总盈亏</button>
                    <button class="tab" onclick="switchMetric('roi_percentage')">ROI%</button>
                    <button class="tab" onclick="switchMetric('win_rate')">胜率</button>
                    <button class="tab" onclick="switchMetric('sharpe_ratio')">夏普比率</button>
                </div>
                
                <div class="leaderboard-container">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>策略</th>
                                <th>盈亏</th>
                                <th>ROI</th>
                                <th>胜率</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <tr>
                                <td colspan="5" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="card">
                <h2>📊 性能趋势</h2>
                <div class="chart-container">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>🎯 策略详情</h2>
            <div id="strategiesContainer" class="loading">加载中...</div>
        </div>
        
        <footer>
            <p>Powered by Hyperliquid | Built with ❤️ for AI Trading</p>
        </footer>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        let currentMetric = 'total_pnl';
        let performanceChart = null;
        
        // 切换指标
        function switchMetric(metric) {
            currentMetric = metric;
            
            // 更新标签状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 重新加载排行榜
            loadLeaderboard();
        }
        
        // 加载排行榜
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}/leaderboard?metric=${currentMetric}&limit=10`);
                const data = await response.json();
                
                const tbody = document.getElementById('leaderboardBody');
                tbody.innerHTML = '';
                
                data.rankings.forEach(item => {
                    const row = document.createElement('tr');
                    
                    const rankClass = item.rank <= 3 ? `rank-${item.rank}` : '';
                    const pnlClass = item.total_pnl >= 0 ? 'positive' : 'negative';
                    const roiClass = item.roi_percentage >= 0 ? 'badge-success' : 'badge-danger';
                    
                    row.innerHTML = `
                        <td><span class="rank ${rankClass}">#${item.rank}</span></td>
                        <td><span class="strategy-name">${item.strategy_name}</span></td>
                        <td class="${pnlClass}">$${item.total_pnl.toFixed(2)}</td>
                        <td><span class="badge ${roiClass}">${item.roi_percentage.toFixed(2)}%</span></td>
                        <td><span class="badge badge-info">${item.win_rate.toFixed(1)}%</span></td>
                    `;
                    
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('加载排行榜失败:', error);
                document.getElementById('leaderboardBody').innerHTML = 
                    '<tr><td colspan="5" class="loading">加载失败，请检查 API 服务器</td></tr>';
            }
        }
        
        // 加载摘要数据
        async function loadSummary() {
            try {
                const response = await fetch(`${API_URL}/leaderboard/summary`);
                const data = await response.json();
                
                document.getElementById('totalStrategies').textContent = data.total_strategies;
                document.getElementById('activeStrategies').textContent = data.active_strategies;
                document.getElementById('totalTrades').textContent = data.total_trades;
                
                const pnlElement = document.getElementById('totalPnl');
                pnlElement.textContent = `$${data.total_pnl.toFixed(2)}`;
                pnlElement.className = 'value ' + (data.total_pnl >= 0 ? 'positive' : 'negative');
            } catch (error) {
                console.error('加载摘要失败:', error);
            }
        }
        
        // 加载策略列表
        async function loadStrategies() {
            try {
                const response = await fetch(`${API_URL}/strategies`);
                const data = await response.json();
                
                const container = document.getElementById('strategiesContainer');
                container.innerHTML = '';
                
                data.strategies.forEach(strategy => {
                    const card = document.createElement('div');
                    card.style.cssText = 'padding: 20px; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 15px;';
                    
                    const state = strategy.state;
                    const statusBadge = state.is_active ? 
                        '<span class="badge badge-success">运行中</span>' : 
                        '<span class="badge badge-danger">已停止</span>';
                    
                    card.innerHTML = `
                        <h3 style="margin-bottom: 10px;">${strategy.name} ${statusBadge}</h3>
                        <p style="color: #666; margin-bottom: 15px;">${strategy.description}</p>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                            <div>
                                <div style="color: #888; font-size: 0.9em;">总交易</div>
                                <div style="font-weight: 600;">${state.total_trades}</div>
                            </div>
                            <div>
                                <div style="color: #888; font-size: 0.9em;">胜率</div>
                                <div style="font-weight: 600;">${state.win_rate.toFixed(1)}%</div>
                            </div>
                            <div>
                                <div style="color: #888; font-size: 0.9em;">盈亏</div>
                                <div style="font-weight: 600; color: ${state.total_pnl >= 0 ? '#10b981' : '#ef4444'}">
                                    $${state.total_pnl.toFixed(2)}
                                </div>
                            </div>
                            <div>
                                <div style="color: #888; font-size: 0.9em;">持仓数</div>
                                <div style="font-weight: 600;">${Object.keys(state.positions).length}</div>
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('加载策略失败:', error);
                document.getElementById('strategiesContainer').innerHTML = '加载失败，请检查 API 服务器';
            }
        }
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '总盈亏',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        // 加载所有数据
        async function loadData() {
            await Promise.all([
                loadSummary(),
                loadLeaderboard(),
                loadStrategies()
            ]);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadData();
            
            // 每 10 秒自动刷新
            setInterval(loadData, 10000);
        });
    </script>
</body>
</html>
