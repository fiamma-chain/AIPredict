<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Trading Arena - AI 模型竞技场</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .subtitle {
            font-size: 1.3em;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card h2 {
            margin-bottom: 25px;
            font-size: 1.8em;
            border-bottom: 3px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 15px;
        }
        
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .leaderboard-table thead {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .leaderboard-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .rank {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .rank-1 { color: #fbbf24; text-shadow: 0 0 10px #fbbf24; }
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px #c0c0c0; }
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px #cd7f32; }
        
        .ai-name {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .badge-success {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
            border: 1px solid #10b981;
        }
        
        .badge-danger {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        
        .badge-info {
            background: rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            border: 1px solid #3b82f6;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }
        
        .ai-cards {
            display: grid;
            gap: 20px;
        }
        
        .ai-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        
        .ai-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }
        
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .ai-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .ai-stat {
            text-align: center;
        }
        
        .ai-stat-label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .ai-stat-value {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .decision-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 3px solid #3b82f6;
        }
        
        .decision-text {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        footer {
            text-align: center;
            padding: 30px;
            opacity: 0.7;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Trading Arena</h1>
            <p class="subtitle">让 AI 模型在真实市场中竞争 | Powered by Hyperliquid</p>
            <div class="status-badge pulse" id="statusBadge">
                ⚡ 系统运行中
            </div>
        </header>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">参赛 AI 数量</div>
                <div class="stat-value" id="totalAI">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总交易次数</div>
                <div class="stat-value" id="totalTrades">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总盈亏</div>
                <div class="stat-value" id="totalPnL">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">平均 ROI</div>
                <div class="stat-value" id="avgROI">0%</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>🏆 AI 排行榜</h2>
                    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
                </div>
                
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchMetric('total_pnl')">总盈亏</button>
                    <button class="tab-btn" onclick="switchMetric('roi_percentage')">ROI%</button>
                    <button class="tab-btn" onclick="switchMetric('win_rate')">胜率</button>
                </div>
                
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>AI 模型</th>
                            <th>盈亏</th>
                            <th>ROI</th>
                            <th>胜率</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="5" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="card">
                <h2>📈 权益曲线对比</h2>
                <div class="chart-container">
                    <canvas id="equityChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>🤖 AI 模型详情</h2>
            <div class="ai-cards" id="aiCards">
                <div class="loading">加载中...</div>
            </div>
        </div>
        
        <footer>
            <p>🚀 AI Trading Arena | 让最聪明的 AI 胜出</p>
            <p style="margin-top: 10px; font-size: 0.9em;">
                Powered by Claude, GPT-4, Gemini & Hyperliquid
            </p>
        </footer>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        let currentMetric = 'total_pnl';
        let equityChart = null;
        
        // 切换排序指标
        function switchMetric(metric) {
            currentMetric = metric;
            
            // 更新按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadLeaderboard();
        }
        
        // 加载排行榜
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}/leaderboard?metric=${currentMetric}&limit=10`);
                const data = await response.json();
                
                const tbody = document.getElementById('leaderboardBody');
                tbody.innerHTML = '';
                
                data.rankings.forEach(ai => {
                    const row = document.createElement('tr');
                    
                    const rankClass = ai.rank <= 3 ? `rank-${ai.rank}` : '';
                    const pnlClass = ai.total_pnl >= 0 ? 'positive' : 'negative';
                    const roiClass = ai.roi_percentage >= 0 ? 'badge-success' : 'badge-danger';
                    
                    row.innerHTML = `
                        <td><span class="rank ${rankClass}">#${ai.rank}</span></td>
                        <td><span class="ai-name">${ai.model_name}</span></td>
                        <td class="${pnlClass}">$${ai.total_pnl.toFixed(2)}</td>
                        <td><span class="badge ${roiClass}">${ai.roi_percentage >= 0 ? '+' : ''}${ai.roi_percentage.toFixed(2)}%</span></td>
                        <td><span class="badge badge-info">${ai.win_rate.toFixed(1)}%</span></td>
                    `;
                    
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('加载排行榜失败:', error);
            }
        }
        
        // 加载摘要数据
        async function loadSummary() {
            try {
                const response = await fetch(`${API_URL}/leaderboard/summary`);
                const data = await response.json();
                
                document.getElementById('totalAI').textContent = data.total_models;
                document.getElementById('totalTrades').textContent = data.total_trades;
                
                const pnlElement = document.getElementById('totalPnL');
                pnlElement.textContent = `$${data.total_pnl.toFixed(2)}`;
                pnlElement.className = 'stat-value ' + (data.total_pnl >= 0 ? 'positive' : 'negative');
                
                const roiElement = document.getElementById('avgROI');
                roiElement.textContent = `${data.average_pnl >= 0 ? '+' : ''}${(data.average_pnl / data.total_models * 0.1).toFixed(2)}%`;
                roiElement.className = 'stat-value ' + (data.average_pnl >= 0 ? 'positive' : 'negative');
            } catch (error) {
                console.error('加载摘要失败:', error);
            }
        }
        
        // 加载 AI 详情
        async function loadAIDetails() {
            try {
                const response = await fetch(`${API_URL}/ai-models`);
                const data = await response.json();
                
                const container = document.getElementById('aiCards');
                container.innerHTML = '';
                
                data.models.forEach(ai => {
                    const card = document.createElement('div');
                    card.className = 'ai-card';
                    
                    const pnlClass = ai.total_pnl >= 0 ? 'positive' : 'negative';
                    
                    let decisionHTML = '';
                    if (ai.recent_decisions && ai.recent_decisions.length > 0) {
                        const lastDecision = ai.recent_decisions[ai.recent_decisions.length - 1];
                        decisionHTML = `
                            <div class="decision-box">
                                <div class="decision-text">
                                    <strong>最近决策:</strong> ${lastDecision.coin} - ${lastDecision.decision.toUpperCase()} 
                                    (置信度: ${lastDecision.confidence.toFixed(1)}%)
                                    <br>
                                    <em>${lastDecision.reasoning}</em>
                                </div>
                            </div>
                        `;
                    }
                    
                    card.innerHTML = `
                        <div class="ai-header">
                            <h3 class="ai-name">${ai.model_name}</h3>
                            <span class="badge ${ai.total_pnl >= 0 ? 'badge-success' : 'badge-danger'}">
                                ${ai.total_pnl >= 0 ? '+' : ''}$${ai.total_pnl.toFixed(2)}
                            </span>
                        </div>
                        
                        <div class="ai-stats">
                            <div class="ai-stat">
                                <div class="ai-stat-label">余额</div>
                                <div class="ai-stat-value">$${ai.current_balance.toFixed(0)}</div>
                            </div>
                            <div class="ai-stat">
                                <div class="ai-stat-label">ROI</div>
                                <div class="ai-stat-value ${pnlClass}">
                                    ${ai.roi_percentage >= 0 ? '+' : ''}${ai.roi_percentage.toFixed(1)}%
                                </div>
                            </div>
                            <div class="ai-stat">
                                <div class="ai-stat-label">交易</div>
                                <div class="ai-stat-value">${ai.total_trades}</div>
                            </div>
                            <div class="ai-stat">
                                <div class="ai-stat-label">胜率</div>
                                <div class="ai-stat-value">${ai.win_rate.toFixed(1)}%</div>
                            </div>
                        </div>
                        
                        ${decisionHTML}
                    `;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('加载 AI 详情失败:', error);
            }
        }
        
        // 加载权益曲线
        async function loadEquityChart() {
            try {
                const response = await fetch(`${API_URL}/ai-models`);
                const data = await response.json();
                
                const ctx = document.getElementById('equityChart').getContext('2d');
                
                if (equityChart) {
                    equityChart.destroy();
                }
                
                const datasets = data.models.map((ai, index) => {
                    const colors = [
                        'rgba(59, 130, 246, 1)',   // 蓝色
                        'rgba(139, 92, 246, 1)',   // 紫色
                        'rgba(236, 72, 153, 1)',   // 粉色
                        'rgba(251, 191, 36, 1)',   // 黄色
                    ];
                    
                    // 模拟权益曲线数据
                    const points = [];
                    let balance = ai.initial_balance;
                    points.push({x: 0, y: balance});
                    
                    // 根据最终余额生成曲线
                    for (let i = 1; i <= 10; i++) {
                        balance = ai.initial_balance + (ai.current_balance - ai.initial_balance) * (i / 10);
                        points.push({x: i, y: balance});
                    }
                    
                    return {
                        label: ai.model_name,
                        data: points,
                        borderColor: colors[index % colors.length],
                        backgroundColor: colors[index % colors.length].replace('1)', '0.1)'),
                        tension: 0.4,
                        fill: false,
                        borderWidth: 3
                    };
                });
                
                equityChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#fff',
                                    font: { size: 14 }
                                }
                            }
                        },
                        scales: {
                            x: {
                                type: 'linear',
                                title: {
                                    display: true,
                                    text: '交易周期',
                                    color: '#fff'
                                },
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                },
                                ticks: {
                                    color: '#fff'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: '账户余额 (USD)',
                                    color: '#fff'
                                },
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                },
                                ticks: {
                                    color: '#fff',
                                    callback: function(value) {
                                        return '$' + value.toFixed(0);
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('加载权益曲线失败:', error);
            }
        }
        
        // 加载所有数据
        async function loadData() {
            await Promise.all([
                loadSummary(),
                loadLeaderboard(),
                loadAIDetails(),
                loadEquityChart()
            ]);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // 每 10 秒自动刷新
            setInterval(loadData, 10000);
        });
    </script>
</body>
</html>
