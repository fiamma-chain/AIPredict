<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 DeepSeek AI Trading Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .positive {
            color: #4ade80;
        }
        
        .negative {
            color: #f87171;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            min-height: 300px;
            max-height: 60vh;
        }
        
        @media (max-width: 768px) {
            .chart-wrapper {
                height: 300px;
            }
        }
        
        .decisions-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .decision-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .decision-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .decision-action {
            font-size: 1.2em;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 5px;
        }
        
        .action-buy {
            background: #4ade80;
            color: #000;
        }
        
        .action-sell {
            background: #f87171;
            color: #000;
        }
        
        .action-hold {
            background: #94a3b8;
            color: #000;
        }
        
        .action-check {
            background: #60a5fa;
            color: #fff;
        }
        
        .action-warning {
            background: #fbbf24;
            color: #000;
        }
        
        .check-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #60a5fa;
        }
        
        .check-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .check-status {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .check-action {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .check-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
            font-size: 0.85em;
        }
        
        @media (max-width: 1200px) {
            .decisions-container {
                grid-column: span 1;
            }
        }
        
        .decision-time {
            opacity: 0.7;
            font-size: 0.9em;
        }
        
        .decision-reasoning {
            margin-top: 10px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .confidence {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 DeepSeek AI Trading Arena</h1>
            <p class="subtitle">BTC 自动交易系统 | 主网实时运行</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">💰 当前余额</div>
                <div class="stat-value" id="balance">$0</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">📈 总盈亏</div>
                <div class="stat-value" id="pnl">$0</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">📊 ROI</div>
                <div class="stat-value" id="roi">0%</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">🔄 交易次数</div>
                <div class="stat-value" id="trades">0</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2 style="margin-bottom: 20px;">📈 权益曲线</h2>
            <div class="chart-wrapper">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div class="decisions-container">
                <h2 style="margin-bottom: 20px;">🧠 开仓决策 (15分钟)</h2>
                <div id="decisions"></div>
            </div>
            
            <div class="decisions-container">
                <h2 style="margin-bottom: 20px;">⚡ 持仓检查 (2分钟)</h2>
                <div id="positionChecks"></div>
            </div>
        </div>
    </div>
    
    <script>
        let equityChart = null;
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('equityChart').getContext('2d');
            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'DeepSeek 权益',
                        data: [],
                        borderColor: '#4ade80',
                        backgroundColor: 'rgba(74, 222, 128, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }
        
        // 窗口大小改变时重新调整图表
        window.addEventListener('resize', () => {
            if (equityChart) {
                equityChart.resize();
            }
        });
        
        // 更新数据
        async function updateData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // 更新统计
                document.getElementById('balance').textContent = `$${data.balance.toFixed(2)}`;
                
                const pnl = data.pnl;
                const pnlElement = document.getElementById('pnl');
                pnlElement.textContent = `$${pnl.toFixed(2)}`;
                pnlElement.className = 'stat-value ' + (pnl >= 0 ? 'positive' : 'negative');
                
                const roi = data.roi;
                const roiElement = document.getElementById('roi');
                roiElement.textContent = `${roi >= 0 ? '+' : ''}${roi.toFixed(2)}%`;
                roiElement.className = 'stat-value ' + (roi >= 0 ? 'positive' : 'negative');
                
                document.getElementById('trades').textContent = data.total_trades;
                
                // 更新图表
                if (data.equity_curve && data.equity_curve.length > 0) {
                    const labels = data.equity_curve.map(point => {
                        const date = new Date(point.time);
                        return date.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
                    });
                    const values = data.equity_curve.map(point => point.balance);
                    
                    equityChart.data.labels = labels;
                    equityChart.data.datasets[0].data = values;
                    equityChart.update('none');
                }
                
                // 更新决策
                const decisionsContainer = document.getElementById('decisions');
                if (data.decisions && data.decisions.length > 0) {
                    decisionsContainer.innerHTML = data.decisions.map(decision => {
                        const date = new Date(decision.time);
                        const timeStr = date.toLocaleString('zh-CN');
                        const actionClass = decision.action.includes('BUY') ? 'buy' : 
                                          decision.action.includes('SELL') ? 'sell' : 'hold';
                        
                        return `
                            <div class="decision-item">
                                <div class="decision-header">
                                    <span class="decision-action action-${actionClass}">
                                        ${decision.action}
                                    </span>
                                    <span class="confidence">信心: ${decision.confidence.toFixed(0)}%</span>
                                    <span class="decision-time">${timeStr}</span>
                                </div>
                                <div style="margin-top: 10px;">
                                    <strong>价格:</strong> $${decision.price.toLocaleString()}
                                </div>
                                <div class="decision-reasoning">
                                    <strong>分析:</strong> ${decision.reasoning}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    decisionsContainer.innerHTML = '<p style="opacity: 0.7;">等待 AI 决策...</p>';
                }
                
                // 更新持仓检查记录
                const checksContainer = document.getElementById('positionChecks');
                if (data.position_checks && data.position_checks.length > 0) {
                    checksContainer.innerHTML = data.position_checks.map(check => {
                        const date = new Date(check.time);
                        const timeStr = date.toLocaleString('zh-CN', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                        
                        if (check.type === 'no_position') {
                            return `
                                <div class="check-item" style="border-left-color: #6b7280;">
                                    <div class="check-header">
                                        <span class="check-status" style="opacity: 0.6;">💤 ${check.status}</span>
                                        <span class="decision-time">${timeStr}</span>
                                    </div>
                                    <div class="check-action" style="opacity: 0.5;">${check.action}</div>
                                </div>
                            `;
                        }
                        
                        // 根据盈亏状态设置颜色
                        let borderColor = '#60a5fa';
                        let pnlColor = '#fff';
                        if (check.pnl_pct > 0) {
                            pnlColor = '#4ade80'; // 绿色
                            borderColor = '#4ade80';
                        } else if (check.pnl_pct < 0) {
                            pnlColor = '#f87171'; // 红色
                            borderColor = '#f87171';
                        }
                        
                        // 检查是否触发止损或止盈
                        let statusIcon = '📊';
                        if (check.status.includes('止损')) {
                            statusIcon = '⚠️';
                            borderColor = '#fbbf24';
                        } else if (check.status.includes('止盈')) {
                            statusIcon = '✅';
                            borderColor = '#4ade80';
                        }
                        
                        return `
                            <div class="check-item" style="border-left-color: ${borderColor};">
                                <div class="check-header">
                                    <span class="check-status">${statusIcon} ${check.coin} ${check.side}</span>
                                    <span class="decision-time">${timeStr}</span>
                                </div>
                                <div class="check-details">
                                    <div>入场: $${check.entry_price.toLocaleString()}</div>
                                    <div>当前: $${check.current_price.toLocaleString()}</div>
                                    <div>数量: ${check.size.toFixed(5)}</div>
                                    <div style="color: ${pnlColor}; font-weight: bold;">
                                        盈亏: ${check.pnl_pct > 0 ? '+' : ''}${check.pnl_pct.toFixed(2)}%
                                    </div>
                                </div>
                                <div class="check-action" style="margin-top: 8px; color: ${check.status.includes('触及') ? '#fbbf24' : '#60a5fa'};">
                                    ${check.action}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    checksContainer.innerHTML = '<p style="opacity: 0.7;">等待持仓检查...</p>';
                }
                
            } catch (error) {
                console.error('更新数据失败:', error);
            }
        }
        
        // 初始化
        initChart();
        updateData();
        
        // 每5秒更新一次
        setInterval(updateData, 5000);
    </script>
</body>
</html>
