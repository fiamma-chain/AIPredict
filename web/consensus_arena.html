<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI共识交易竞技场</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #0b0e11;
            color: #e8e9ed;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .groups-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .group-card {
            background: #1e222d;
            border: 1px solid #2b3139;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .group-card:hover {
            border-color: #3a3f4b;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }
        
        .group-name {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .group-address {
            font-size: 0.8em;
            opacity: 0.7;
            font-family: monospace;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: #131722;
            border: 1px solid #2b3139;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .positive {
            color: #4ade80;
        }
        
        .negative {
            color: #f87171;
        }
        
        .chart-container {
            background: #1e222d;
            border: 1px solid #2b3139;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        
        .decisions-container {
            background: #1e222d;
            border: 1px solid #2b3139;
            border-radius: 12px;
            padding: 25px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .decision-item {
            background: #131722;
            border: 1px solid #2b3139;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #60a5fa;
        }
        
        .decision-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .decision-action {
            font-weight: bold;
            font-size: 1.2em;
            padding: 5px 12px;
            border-radius: 6px;
            background: rgba(96, 165, 250, 0.3);
        }
        
        .decision-time {
            opacity: 0.7;
            font-size: 0.9em;
        }
        
        .ai-votes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .ai-vote {
            background: #1e222d;
            border: 1px solid #2b3139;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .ai-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .consensus-summary {
            margin-top: 12px;
            padding: 12px;
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 6px;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e222d;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3a3f4b;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4f5b;
        }
        
        .kline-chart-container {
            background: #1e222d;
            border: 1px solid #2b3139;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        #klineChart {
            width: 100%;
            height: 500px;
            background: #131722;
            border-radius: 8px;
        }
        
        .kline-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        .kline-controls button {
            padding: 8px 16px;
            border: 1px solid #2b3139;
            border-radius: 6px;
            background: #131722;
            color: #e8e9ed;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .kline-controls button:hover {
            background: #1e222d;
            border-color: #3a3f4b;
        }
        
        .kline-controls button.active {
            background: #2962ff;
            border-color: #2962ff;
            color: white;
        }
        
        .trade-legend {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
            margin-left: auto;
        }
        
        .trade-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .legend-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI共识交易竞技场</h1>
            <p class="subtitle">Alpha组 vs Beta组 | 主网实时对战</p>
        </header>
        
        <div class="groups-container">
            <!-- Alpha组 -->
            <div class="group-card">
                <div class="group-header">
                    <div>
                        <div class="group-name">🅰️ Alpha组</div>
                        <div style="font-size: 0.9em; opacity: 0.8; margin-top: 5px;">DeepSeek + Claude + Grok4</div>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">💰 余额</div>
                        <div class="stat-value" id="alpha-balance">$0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📈 盈亏</div>
                        <div class="stat-value" id="alpha-pnl">$0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📊 ROI</div>
                        <div class="stat-value" id="alpha-roi">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">🔄 交易</div>
                        <div class="stat-value" id="alpha-trades">0</div>
                    </div>
                </div>
                <div class="group-address" id="alpha-address">地址: 加载中...</div>
            </div>
            
            <!-- Beta组 -->
            <div class="group-card">
                <div class="group-header">
                    <div>
                        <div class="group-name">🅱️ Beta组</div>
                        <div style="font-size: 0.9em; opacity: 0.8; margin-top: 5px;">GPT-4 + Gemini + Qwen</div>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">💰 余额</div>
                        <div class="stat-value" id="beta-balance">$0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📈 盈亏</div>
                        <div class="stat-value" id="beta-pnl">$0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📊 ROI</div>
                        <div class="stat-value" id="beta-roi">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">🔄 交易</div>
                        <div class="stat-value" id="beta-trades">0</div>
                    </div>
                </div>
                <div class="group-address" id="beta-address">地址: 加载中...</div>
            </div>
        </div>
        
        <!-- K线图 -->
        <div class="kline-chart-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>📊 市场K线图 & 交易标记</h2>
                <div class="kline-controls">
                    <button onclick="changeInterval('5m')">5分钟</button>
                    <button onclick="changeInterval('15m')" class="active">15分钟</button>
                    <button onclick="changeInterval('1h')">1小时</button>
                    <button onclick="changeInterval('4h')">4小时</button>
                    <div class="trade-legend">
                        <div class="trade-legend-item">
                            <div class="legend-marker" style="background: #4ade80;"></div>
                            <span>Alpha开仓</span>
                        </div>
                        <div class="trade-legend-item">
                            <div class="legend-marker" style="background: #86efac;"></div>
                            <span>Alpha平仓</span>
                        </div>
                        <div class="trade-legend-item">
                            <div class="legend-marker" style="background: #60a5fa;"></div>
                            <span>Beta开仓</span>
                        </div>
                        <div class="trade-legend-item">
                            <div class="legend-marker" style="background: #93c5fd;"></div>
                            <span>Beta平仓</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="klineChart"></div>
        </div>
        
        <!-- 权益曲线对比 -->
        <div class="chart-container">
            <h2 style="margin-bottom: 20px;">📈 权益曲线对比</h2>
            <div class="chart-wrapper">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
        
        <!-- 共识决策记录 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div class="decisions-container">
                <h2 style="margin-bottom: 20px;">🅰️ Alpha组 - 共识决策</h2>
                <div id="alpha-decisions"></div>
            </div>
            
            <div class="decisions-container">
                <h2 style="margin-bottom: 20px;">🅱️ Beta组 - 共识决策</h2>
                <div id="beta-decisions"></div>
            </div>
        </div>
    </div>
    
    <script>
        let equityChart = null;
        let klineChart = null;
        let candlestickSeries = null;
        let currentInterval = '15m';
        
        function initKlineChart() {
            const chartContainer = document.getElementById('klineChart');
            
            // 检查 LightweightCharts 是否加载
            if (typeof LightweightCharts === 'undefined') {
                console.error('❌ LightweightCharts 未加载');
                return;
            }
            
            console.log('LightweightCharts 版本:', LightweightCharts);
            
            klineChart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 500,
                layout: {
                    background: { color: 'rgba(0, 0, 0, 0)' },
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: 'rgba(197, 203, 206, 0.1)' },
                    horzLines: { color: 'rgba(197, 203, 206, 0.1)' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                },
            });
            
            console.log('klineChart 创建成功:', klineChart);
            console.log('可用方法:', Object.keys(klineChart));
            
            // 使用正确的API方法名
            if (typeof klineChart.addCandlestickSeries === 'function') {
                candlestickSeries = klineChart.addCandlestickSeries({
                    upColor: '#4ade80',
                    downColor: '#f87171',
                    borderUpColor: '#4ade80',
                    borderDownColor: '#f87171',
                    wickUpColor: '#4ade80',
                    wickDownColor: '#f87171',
                });
            } else if (typeof klineChart.addAreaSeries === 'function') {
                // 如果addCandlestickSeries不存在，尝试其他方法
                console.log('使用备用方案: addAreaSeries');
                candlestickSeries = klineChart.addAreaSeries({
                    topColor: 'rgba(74, 222, 128, 0.4)',
                    bottomColor: 'rgba(74, 222, 128, 0)',
                    lineColor: 'rgba(74, 222, 128, 1)',
                    lineWidth: 2,
                });
            } else {
                console.error('❌ 无可用的图表类型');
                return;
            }
            
            console.log('candlestickSeries 创建成功');
            
            // 响应式调整
            window.addEventListener('resize', () => {
                klineChart.applyOptions({ width: chartContainer.clientWidth });
            });
        }
        
        async function updateKlineChart() {
            try {
                // 检查candlestickSeries是否已初始化
                if (!candlestickSeries) {
                    console.error('❌ candlestickSeries 未初始化');
                    return;
                }
                
                const response = await fetch(`/api/kline?interval=${currentInterval}&lookback=200`);
                const data = await response.json();
                
                if (data.error) {
                    console.error('获取K线数据失败:', data.error);
                    return;
                }
                
                if (!data.candles || data.candles.length === 0) {
                    console.warn('⚠️ K线数据为空');
                    return;
                }
                
                // 转换K线数据格式
                const candlesData = data.candles.map(candle => ({
                    time: candle.time / 1000, // 转换为秒
                    open: candle.open,
                    high: candle.high,
                    low: candle.low,
                    close: candle.close
                }));
                
                candlestickSeries.setData(candlesData);
                console.log(`✅ K线数据已更新: ${candlesData.length} 根`);
                
                // 添加交易标记
                if (data.trade_markers && data.trade_markers.length > 0) {
                    const markers = data.trade_markers.map(trade => {
                        const isAlpha = trade.group === 'Alpha组';
                        const isOpen = trade.action === 'OPEN';
                        
                        // Alpha组: 绿色系, Beta组: 蓝色系
                        // 开仓: 深色, 平仓: 浅色
                        let color = '#4ade80'; // Alpha开仓
                        if (isAlpha && !isOpen) color = '#86efac'; // Alpha平仓
                        if (!isAlpha && isOpen) color = '#60a5fa'; // Beta开仓
                        if (!isAlpha && !isOpen) color = '#93c5fd'; // Beta平仓
                        
                        const shape = isOpen ? 'arrowUp' : 'arrowDown';
                        
                        // 构建标签文本
                        let text = `${trade.group} ${isOpen ? '开' : '平'}${trade.side}`;
                        if (!isOpen && trade.pnl !== 0) {
                            text += ` P/L: $${trade.pnl.toFixed(2)}`;
                        }
                        
                        return {
                            time: trade.time / 1000,
                            position: isOpen ? 'belowBar' : 'aboveBar',
                            color: color,
                            shape: shape,
                            text: text
                        };
                    });
                    
                    candlestickSeries.setMarkers(markers);
                }
                
            } catch (error) {
                console.error('更新K线图失败:', error);
            }
        }
        
        function changeInterval(interval) {
            currentInterval = interval;
            
            // 更新按钮状态
            document.querySelectorAll('.kline-controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 重新加载K线数据
            updateKlineChart();
        }
        
        function initChart() {
            const ctx = document.getElementById('equityChart').getContext('2d');
            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Alpha组',
                            data: [],
                            borderColor: 'rgb(74, 222, 128)',
                            backgroundColor: 'rgba(74, 222, 128, 0.1)',
                            tension: 0.4,
                            borderWidth: 3
                        },
                        {
                            label: 'Beta组',
                            data: [],
                            borderColor: 'rgb(96, 165, 250)',
                            backgroundColor: 'rgba(96, 165, 250, 0.1)',
                            tension: 0.4,
                            borderWidth: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff', font: { size: 14 } }
                        }
                    },
                    scales: {
                        y: {
                            min: 499,  // 初始范围紧凑
                            max: 501,  // 初始范围紧凑
                            ticks: { 
                                color: '#fff',
                                stepSize: 0.5  // 精细刻度
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }
        
        // 实时余额更新（每5秒平滑更新权益曲线终点）
        async function updateRealtimeBalance() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (!data.groups || data.groups.length < 2) return;
                
                const alphaGroup = data.groups[0];
                const betaGroup = data.groups[1];
                
                // 更新余额显示
                document.getElementById('alpha-balance').textContent = `$${alphaGroup.balance.toFixed(2)}`;
                document.getElementById('alpha-pnl').textContent = `$${alphaGroup.pnl.toFixed(2)}`;
                document.getElementById('alpha-pnl').className = 'stat-value ' + (alphaGroup.pnl >= 0 ? 'positive' : 'negative');
                document.getElementById('alpha-roi').textContent = `${alphaGroup.roi >= 0 ? '+' : ''}${alphaGroup.roi.toFixed(2)}%`;
                document.getElementById('alpha-roi').className = 'stat-value ' + (alphaGroup.roi >= 0 ? 'positive' : 'negative');
                
                document.getElementById('beta-balance').textContent = `$${betaGroup.balance.toFixed(2)}`;
                document.getElementById('beta-pnl').textContent = `$${betaGroup.pnl.toFixed(2)}`;
                document.getElementById('beta-pnl').className = 'stat-value ' + (betaGroup.pnl >= 0 ? 'positive' : 'negative');
                document.getElementById('beta-roi').textContent = `${betaGroup.roi >= 0 ? '+' : ''}${betaGroup.roi.toFixed(2)}%`;
                document.getElementById('beta-roi').className = 'stat-value ' + (betaGroup.roi >= 0 ? 'positive' : 'negative');
                
                // 平滑更新权益曲线
                if (equityChart) {
                    const alphaData = equityChart.data.datasets[0].data;
                    const betaData = equityChart.data.datasets[1].data;
                    const labels = equityChart.data.labels;
                    
                    // 如果图表还没有数据，添加初始点
                    if (alphaData.length === 0) {
                        labels.push('起点');
                        alphaData.push(500);
                        betaData.push(500);
                    }
                    
                    // 添加新的实时数据点（每次都添加，保持5秒粒度）
                    const now = new Date();
                    const timeLabel = now.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                    
                    // 添加新点（不是更新最后一个点）
                    labels.push(timeLabel);
                    alphaData.push(alphaGroup.balance);
                    betaData.push(betaGroup.balance);
                    
                    // 限制数据点数量，避免过多（保留最近200个点，约16分钟）
                    const maxPoints = 200;
                    if (alphaData.length > maxPoints) {
                        labels.shift();
                        alphaData.shift();
                        betaData.shift();
                    }
                    
                    // 动态调整Y轴范围（精细颗粒度）
                    const allValues = [...alphaData, ...betaData];
                    const minVal = Math.min(...allValues);
                    const maxVal = Math.max(...allValues);
                    const range = maxVal - minVal;
                    
                    // 根据实际波动调整padding，保持更紧凑的视图
                    let padding;
                    if (range < 0.1) {
                        padding = 0.5;  // 极小波动
                    } else if (range < 1) {
                        padding = 1;    // 小波动
                    } else if (range < 5) {
                        padding = 2;    // 中等波动
                    } else {
                        padding = range * 0.3;  // 大波动
                    }
                    
                    equityChart.options.scales.y.min = Math.max(490, Math.floor(minVal - padding));
                    equityChart.options.scales.y.max = Math.min(510, Math.ceil(maxVal + padding));
                    
                    // 设置更精细的刻度
                    equityChart.options.scales.y.ticks.stepSize = range < 2 ? 0.5 : (range < 10 ? 1 : 2);
                    
                    // 使用'none'模式实现无感知更新（不重绘动画）
                    equityChart.update('none');
                }
                
            } catch (error) {
                console.error('实时余额更新失败:', error);
            }
        }
        
        async function updateData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (!data.groups || data.groups.length < 2) return;
                
                const alphaGroup = data.groups[0];
                const betaGroup = data.groups[1];
                
                // 更新Alpha组统计
                document.getElementById('alpha-balance').textContent = `$${alphaGroup.balance.toFixed(2)}`;
                document.getElementById('alpha-pnl').textContent = `$${alphaGroup.pnl.toFixed(2)}`;
                document.getElementById('alpha-pnl').className = 'stat-value ' + (alphaGroup.pnl >= 0 ? 'positive' : 'negative');
                document.getElementById('alpha-roi').textContent = `${alphaGroup.roi >= 0 ? '+' : ''}${alphaGroup.roi.toFixed(2)}%`;
                document.getElementById('alpha-roi').className = 'stat-value ' + (alphaGroup.roi >= 0 ? 'positive' : 'negative');
                document.getElementById('alpha-trades').textContent = alphaGroup.total_trades;
                document.getElementById('alpha-address').textContent = `地址: ${alphaGroup.address}`;
                
                // 更新Beta组统计
                document.getElementById('beta-balance').textContent = `$${betaGroup.balance.toFixed(2)}`;
                document.getElementById('beta-pnl').textContent = `$${betaGroup.pnl.toFixed(2)}`;
                document.getElementById('beta-pnl').className = 'stat-value ' + (betaGroup.pnl >= 0 ? 'positive' : 'negative');
                document.getElementById('beta-roi').textContent = `${betaGroup.roi >= 0 ? '+' : ''}${betaGroup.roi.toFixed(2)}%`;
                document.getElementById('beta-roi').className = 'stat-value ' + (betaGroup.roi >= 0 ? 'positive' : 'negative');
                document.getElementById('beta-trades').textContent = betaGroup.total_trades;
                document.getElementById('beta-address').textContent = `地址: ${betaGroup.address}`;
                
                // 更新图表（当有新决策时，添加新的数据点）
                if (alphaGroup.equity_curve && alphaGroup.equity_curve.length > 0) {
                    const labels = alphaGroup.equity_curve.map(p => new Date(p.time).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}));
                    const alphaValues = alphaGroup.equity_curve.map(p => p.balance);
                    const betaValues = betaGroup.equity_curve.map(p => p.balance);
                    
                    // 确保起点都是500
                    if (alphaValues.length > 0 && alphaValues[0] !== 500) {
                        alphaValues.unshift(500);
                        labels.unshift('起点');
                    }
                    if (betaValues.length > 0 && betaValues[0] !== 500) {
                        betaValues.unshift(500);
                    }
                    
                    equityChart.data.labels = labels;
                    equityChart.data.datasets[0].data = alphaValues;
                    equityChart.data.datasets[1].data = betaValues;
                    
                    // 动态调整Y轴范围（精细颗粒度）
                    const allValues = [...alphaValues, ...betaValues];
                    const minVal = Math.min(...allValues);
                    const maxVal = Math.max(...allValues);
                    const range = maxVal - minVal;
                    
                    // 根据实际波动调整padding，保持更紧凑的视图
                    let padding;
                    if (range < 0.1) {
                        padding = 0.5;  // 极小波动
                    } else if (range < 1) {
                        padding = 1;    // 小波动
                    } else if (range < 5) {
                        padding = 2;    // 中等波动
                    } else {
                        padding = range * 0.3;  // 大波动
                    }
                    
                    equityChart.options.scales.y.min = Math.max(490, Math.floor(minVal - padding));
                    equityChart.options.scales.y.max = Math.min(510, Math.ceil(maxVal + padding));
                    
                    // 设置更精细的刻度
                    equityChart.options.scales.y.ticks.stepSize = range < 2 ? 0.5 : (range < 10 ? 1 : 2);
                    
                    equityChart.update('none');
                }
                
                // 更新Alpha组决策
                updateDecisions('alpha-decisions', alphaGroup.consensus_decisions);
                
                // 更新Beta组决策
                updateDecisions('beta-decisions', betaGroup.consensus_decisions);
                
            } catch (error) {
                console.error('更新数据失败:', error);
            }
        }
        
        function updateDecisions(containerId, decisions) {
            const container = document.getElementById(containerId);
            if (!decisions || decisions.length === 0) {
                container.innerHTML = '<p style="opacity: 0.7;">等待共识决策...</p>';
                return;
            }
            
            container.innerHTML = decisions.map(decision => {
                const date = new Date(decision.time);
                const timeStr = date.toLocaleString('zh-CN');
                
                let aiVotesHtml = '';
                if (decision.ai_votes && decision.ai_votes.length > 0) {
                    aiVotesHtml = '<div class="ai-votes">' +
                        decision.ai_votes.map(vote => `
                            <div class="ai-vote">
                                <div class="ai-name">${vote.ai_name}</div>
                                <div>${vote.decision}</div>
                                <div style="font-size: 0.85em; opacity: 0.8;">信心: ${vote.confidence.toFixed(0)}%</div>
                            </div>
                        `).join('') +
                        '</div>';
                }
                
                return `
                    <div class="decision-item">
                        <div class="decision-header">
                            <span class="decision-action">${decision.decision}</span>
                            <span class="decision-time">${timeStr}</span>
                        </div>
                        <div>
                            <strong>价格:</strong> $${decision.price.toLocaleString()}
                        </div>
                        ${aiVotesHtml}
                        <div class="consensus-summary">
                            <strong>共识总结:</strong><br>
                            ${decision.summary.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 等待页面完全加载后再初始化
        window.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始初始化...');
            
            try {
                initKlineChart();
                console.log('✅ K线图初始化成功');
            } catch (e) {
                console.error('❌ K线图初始化失败:', e);
            }
            
            try {
                initChart();
                console.log('✅ 权益曲线初始化成功');
            } catch (e) {
                console.error('❌ 权益曲线初始化失败:', e);
            }
            
            try {
                updateData();
                console.log('✅ 数据更新成功');
            } catch (e) {
                console.error('❌ 数据更新失败:', e);
            }
            
            try {
                updateKlineChart();
                console.log('✅ K线数据加载成功');
            } catch (e) {
                console.error('❌ K线数据加载失败:', e);
            }
            
            // 每5秒更新余额和权益曲线终点（平滑无感知）
            setInterval(updateRealtimeBalance, 5000);
            
            // 每30秒更新完整数据（决策记录等）
            setInterval(updateData, 30000);
            
            // K线每30秒更新一次
            setInterval(updateKlineChart, 30000);
            
            console.log('✅ 所有初始化完成');
            console.log('💚 实时余额更新已启用：每5秒平滑更新');
        });
    </script>
</body>
</html>
